    <style>
      .title{font:800 46px 'Segoe UI',Arial,sans-serif;fill:#f7f9fc;letter-spacing:2px}.subtitle{font:600 23px Consolas,monospace;fill:#36d7e8;letter-spacing:1.2px}.section{font:800 26px 'Segoe UI',Arial,sans-serif;fill:#f7f9fc;letter-spacing:.7px}.heading{font:750 23px 'Segoe UI',Arial,sans-serif;fill:#f7f9fc}.label{font:700 20px 'Segoe UI',Arial,sans-serif;fill:#f7f9fc}.small{font:600 16px Consolas,monospace;fill:#aebfd1}.chipText{font:750 16px 'Segoe UI',Arial,sans-serif;fill:#ffe3e8}.featureTitle{font:800 29px 'Segoe UI',Arial,sans-serif;fill:#f7f9fc;letter-spacing:.4px}.panel{fill:#0a1729;stroke-width:2;filter:url(#shadow)}.core{stroke:#36d7e8}.memory{stroke:#58d68d}.extension{stroke:#f4ba43}.danger{stroke:#fb7185}.inner{fill:#0d1c30;stroke:#2c4967;stroke-width:1.5}.flow{fill:none;stroke:#36d7e8;stroke-width:3.2;marker-end:url(#arrowCyan)}.return{fill:none;stroke:#36d7e8;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#arrowCyan)}.memoryFlow{fill:none;stroke:#58d68d;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrowGreen)}.extensionFlow{fill:none;stroke:#f4ba43;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#arrowAmber)}.exitFlow{fill:none;stroke:#fb7185;stroke-width:2.7;marker-end:url(#arrowRed)}.icon{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    </style>
