<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Coding Agent architecture overview</title>
  <desc id="desc">A concise visual overview of the agent loop, termination paths, tools, context, memory, sessions, skills, plugins, parallel execution, subagents, and safety.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101d"/><stop offset="0.52" stop-color="#0a1525"/><stop offset="1" stop-color="#070d17"/>
    </linearGradient>
    <radialGradient id="loopGlow" cx="50%" cy="45%" r="64%">
      <stop offset="0" stop-color="#0d2635" stop-opacity="0.9"/><stop offset="1" stop-color="#091524" stop-opacity="0.25"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1b324c" stroke-width="1" opacity="0.24"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000711" flood-opacity="0.58"/>
    </filter>
    <filter id="cyanGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
